[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repbox"
version = "2.0.0"
description = "RepBox Python-first pipeline scaffold"
requires-python = ">=3.9"
readme = "README.md"

[project.scripts]
repbox = "repbox.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
